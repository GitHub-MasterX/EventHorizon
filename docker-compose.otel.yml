# Optional structured-log overlay. The default stack does not require this file.
# This collector has a logs-only pipeline and does not export Prometheus metrics.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: eventhorizon-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    user: "${EVENTHORIZON_OTEL_UID:-1001}:${EVENTHORIZON_OTEL_GID:-1001}"
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/eventhorizon:ro
      - ./otel-output:/var/log/eventhorizon-otel
      - ./otelcol/eventhorizon-filelog.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - telnet_pit
      - mqtt_pit
      - upnp_pit
      - coap_pit
