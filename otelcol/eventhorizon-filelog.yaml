receivers:
  filelog/eventhorizon:
    include:
      - /var/log/eventhorizon/eventhorizon.jsonl
    start_at: beginning
    operators:
      - type: json_parser
        parse_from: body
        timestamp:
          parse_from: attributes.ts
          layout_type: strptime
          layout: "%Y-%m-%dT%H:%M:%S.%LZ"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch: {}

exporters:
  debug:
    verbosity: detailed
  file/eventhorizon_archive:
    path: /var/log/eventhorizon-otel/eventhorizon-otel.json

service:
  pipelines:
    logs/eventhorizon:
      receivers: [filelog/eventhorizon]
      processors: [memory_limiter, batch]
      exporters: [debug, file/eventhorizon_archive]
