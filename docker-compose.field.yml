x-rotated-local-logs: &rotated-local-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-process-healthcheck: &process-healthcheck
  test: ["CMD-SHELL", "kill -0 1"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 20s

services:
  prometheus-exporter:
    platform: linux/amd64
    restart: unless-stopped
    environment:
      EVENTHORIZON_FIELD_SAFE_MODE: "true"
    ports: !override
      - "127.0.0.1:9101:9101"
    healthcheck: *process-healthcheck
    logging: *rotated-local-logs
    labels:
      org.eventhorizon.field.role: monitoring

  telnet_pit:
    platform: linux/amd64
    restart: unless-stopped
    cpus: "${FIELD_TARPIT_CPU_LIMIT:-0.50}"
    mem_limit: "${FIELD_TARPIT_MEMORY_LIMIT:-0}"
    pids_limit: 512
    ports: !override
      - "0.0.0.0:${TELNET_PORT:-23}:${TELNET_PORT:-23}/tcp"
    environment:
      EVENTHORIZON_SESSION_LOG: /dev/null
    healthcheck: *process-healthcheck
    logging:
      driver: none
    labels:
      org.eventhorizon.field.role: tarpit
      org.eventhorizon.field.protocol: telnet

  mqtt_pit:
    platform: linux/amd64
    restart: unless-stopped
    cpus: "${FIELD_TARPIT_CPU_LIMIT:-0.50}"
    mem_limit: "${FIELD_TARPIT_MEMORY_LIMIT:-0}"
    pids_limit: 512
    ports: !override
      - "0.0.0.0:${MQTT_PORT:-1883}:${MQTT_PORT:-1883}/tcp"
    environment:
      EVENTHORIZON_SESSION_LOG: /dev/null
    healthcheck: *process-healthcheck
    logging:
      driver: none
    labels:
      org.eventhorizon.field.role: tarpit
      org.eventhorizon.field.protocol: mqtt

  prometheus:
    platform: linux/amd64
    image: prom/prometheus:v3.5.0@sha256:8672a850efe2f9874702406c8318704edb363587f8c2ca88586b4c8fdb5cea24
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:9090:9090"
    healthcheck: *process-healthcheck
    logging: *rotated-local-logs
    labels:
      org.eventhorizon.field.role: monitoring

  grafana:
    platform: linux/amd64
    image: grafana/grafana-oss:12.1.0@sha256:11c2e6c7993917ea89292b942e3428f73907b2809d554154bfb8b4ceb2301cc8
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:3000:3000"
    healthcheck: *process-healthcheck
    logging: *rotated-local-logs
    labels:
      org.eventhorizon.field.role: monitoring

  cadvisor:
    platform: linux/amd64
    image: ghcr.io/google/cadvisor:v0.57.0@sha256:1742bab953d9d9ab166cba24604a9488efdff7d73dc6d18a087c09a1bcd6cb9d
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8081:8080"
    logging: *rotated-local-logs
    labels:
      org.eventhorizon.field.role: monitoring

  upnp_pit:
    profiles: ["non-field-protocols"]

  coap_pit:
    profiles: ["non-field-protocols"]

  endlessh:
    profiles: ["non-field-protocols"]
